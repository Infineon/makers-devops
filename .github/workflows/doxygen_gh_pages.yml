name: Doxygen GH Pages

### QUICK REFERENCE ###

# Required project structure:
# InfineonDoxyGenerator is cloned at runtime and used to build HTML docs.

# How to call this workflow from another workflow:
# name: Doxygen GH
# on:
#   push:
#     branches: [ master, develop ]
#   pull_request:
#     branches: [ master, develop ]
# permissions:
#   contents: write
# jobs:
#   call-workflow:
#     uses: Infineon/makers-devops/.github/workflows/doxygen_gh_pages.yml@main
#     permissions:
#       contents: write

on:
  workflow_call:
    inputs:
      python-version:
        required: false
        type: string
        default: '3.x'
        description: 'Python version to use.'
      publish-dir:
        required: false
        type: string
        default: './docs/doxygen/build/html/'
        description: 'Directory with the built HTML documentation to publish.'
      publish-branch:
        required: false
        type: string
        default: 'gh-pages'
        description: 'Branch to deploy the documentation to.'

jobs:
  build-documentation:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6

    - name: Cache pip
      uses: actions/cache@v5
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: ${{ runner.os }}-pip-

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Install doxygen
      run: |
        sudo apt-get update
        sudo apt-get install -y doxygen graphviz

    - name: Run doxygen
      run: |
        git clone https://github.com/Infineon/InfineonDoxyGenerator.git
        cd InfineonDoxyGenerator
        python doxyifx.py html

    - name: GH Pages Deployment
      uses: peaceiris/actions-gh-pages@v4
      if: success() && github.event_name == 'push'
      with:
        publish_dir: ${{ inputs.publish-dir }}
        enable_jekyll: false
        allow_empty_commit: false
        force_orphan: true
        publish_branch: ${{ inputs.publish-branch }}
        github_token: ${{ secrets.GITHUB_TOKEN }}
